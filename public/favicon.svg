<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="od-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161824"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background badge -->
  <rect width="100" height="100" rx="28" fill="url(#bg-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Outer glowing ring fragment -->
  <circle cx="50" cy="50" r="38" stroke="url(#od-grad)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
  
  <!-- OD Lettermark -->
  <!-- 'O' shape -->
  <circle cx="40" cy="50" r="18" stroke="url(#od-grad)" stroke-width="4.5" fill="none"/>
  
  <!-- 'D' shape interlocking -->
  <path d="M52 32 V68 M52 32 C68 32 76 40 76 50 C76 60 68 68 52 68" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  
  <!-- Subtle accent node -->
  <circle cx="76" cy="50" r="2.5" fill="#10b981"/>
</svg>
